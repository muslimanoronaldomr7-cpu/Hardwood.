<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>G-Flip</title>
<style>
  :root{--accent:#5ef0d0;--ink:#f2f6ff;--dim:#9db0d6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0c1024;color:var(--ink);overflow:hidden;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,28,.62)}
  #overlay.hide{display:none}
  .card{width:min(380px,90vw);text-align:center;padding:28px 24px;background:#161c42;border-radius:20px;border:2px solid #2a3470}
  .card h1{margin:0 0 6px;font:800 52px "Trebuchet MS",system-ui,sans-serif;letter-spacing:-1px}
  .card p{margin:0 0 18px;color:var(--dim);font-size:15px;line-height:1.5}
  #play{width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#06241d;
    font:800 18px "Trebuchet MS",system-ui,sans-serif;cursor:pointer}
  #play:hover{filter:brightness(1.1)}
  #play:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div class="card">
    <h1>G-Flip</h1>
    <p id="msg">Your cube runs on its own. Tap, click, or press Space to flip gravity. Dodge the spikes and blocks.</p>
    <button id="play" type="button">Play</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const LH = 360, FLOOR = 300, CEIL = 60, S = 30, PX = 150, G = 2700;
  let W, H, DPR, sc, VW;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    sc = Math.min(H / LH, W / 560);
    VW = W / sc;
  }
  addEventListener('resize', resize); resize();

  const rnd = (a, b) => a + Math.random() * (b - a);
  let state = 'menu', speed, camX, y, vy, dir, rot, rotT, obs, nextX, parts, trail;
  let best = 0, deadT = 0, shake = 0, flips = 0, last = performance.now();
  try { best = +localStorage.getItem('gflip-best') || 0; } catch (e) {}
  const bld = Array.from({ length: 30 }, () => ({ x: rnd(0, 2400), w: rnd(40, 90), h: rnd(60, 200) }));
  const score = () => Math.floor(camX / 30);

  // sound
  let ac;
  function beep(f, d, type, v) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(v || 0.04, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }

  function reset() {
    speed = 340; camX = 0; dir = 1; y = FLOOR - S; vy = 0; rot = 0; rotT = 0;
    obs = []; parts = []; trail = []; nextX = PX + 800; shake = 0; flips = 0; deadT = 0;
    fill();
  }

  function fill() { while (nextX < camX + VW + 300) gen(); }

  function gen() {
    const d = Math.min(1, camX / 30000), x = nextX;
    let r = Math.random(); if (camX < 3000) r *= 0.72;
    const side = () => Math.random() < 0.5 ? 'f' : 'c';
    const spike = (sx, sd) => obs.push({ t: 's', x: sx, w: 28, h: 26, y: sd === 'f' ? FLOOR - 26 : CEIL, sd });
    const block = (bx, bw, bh, sd) => obs.push({ t: 'b', x: bx, w: bw, h: bh, y: sd === 'f' ? FLOOR - bh : CEIL, sd });
    let end = x;
    if (r < 0.30) { spike(x, side()); end = x + 28; }
    else if (r < 0.50) {
      const sd = side(), n = 2 + (Math.random() < 0.5 ? 1 : 0);
      for (let i = 0; i < n; i++) spike(x + i * 28, sd);
      end = x + n * 28;
    }
    else if (r < 0.72) {
      const bw = rnd(60, 150), bh = rnd(40, 110);
      block(x, bw, bh, side()); end = x + bw;
    }
    else if (r < 0.88) {
      const a = side(), b = a === 'f' ? 'c' : 'f';
      block(x, 70, rnd(50, 100), a);
      const x2 = x + 70 + speed * 0.7 + 30;
      block(x2, 70, rnd(50, 100), b); end = x2 + 70;
    }
    else {
      const a = side(), b = a === 'f' ? 'c' : 'f', sp = speed * 0.7 + 40;
      spike(x, a); spike(x + sp, b); spike(x + sp * 2, a);
      end = x + sp * 2 + 28;
    }
    nextX = end + speed * 0.7 + rnd(0, 120) * (1 - d * 0.5);
  }

  function flip() {
    dir = -dir; rotT += Math.PI; vy = dir * 150; flips++;
    beep(dir === 1 ? 330 : 520, 0.08);
  }

  function die() {
    if (state !== 'play') return;
    state = 'dead'; deadT = 0; shake = 10;
    const s = score();
    if (s > best) { best = s; try { localStorage.setItem('gflip-best', best); } catch (e) {} }
    for (let i = 0; i < 28; i++)
      parts.push({ x: camX + PX + S / 2, y: y + S / 2, vx: rnd(-320, 320), vy: rnd(-320, 320), a: 1 });
    beep(110, 0.35, 'sawtooth', 0.07);
    $('msg').textContent = `You crashed. Distance ${s} m. Best ${best} m.`;
    $('play').textContent = 'Retry';
  }

  function start() {
    if (state === 'play') return;
    if (state === 'dead' && deadT < 0.4) return;
    reset(); state = 'play';
    $('overlay').classList.add('hide');
    beep(440, 0.1);
  }

  function update(dt) {
    if (state === 'menu') { camX += 160 * dt; return; }
    if (state === 'dead') {
      deadT += dt; shake = Math.max(0, shake - dt * 30);
      for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.a -= dt * 1.4; }
      parts = parts.filter(p => p.a > 0);
      if (deadT > 0.7) $('overlay').classList.remove('hide');
      return;
    }
    speed = Math.min(560, 340 + camX / 90);
    camX += speed * dt;
    const px = camX + PX, prevY = y;
    vy += G * dir * dt;
    vy = Math.max(-1100, Math.min(1100, vy));
    y += vy * dt;
    if (y > FLOOR - S) { y = FLOOR - S; vy = 0; }
    if (y < CEIL) { y = CEIL; vy = 0; }

    for (const o of obs) {
      if (o.x > px + S || o.x + o.w < px) continue;
      if (o.t === 's') {
        const hx = o.x + 8, hw = o.w - 16;
        const hy = o.sd === 'f' ? o.y + 8 : o.y, hh = o.h - 8;
        if (px + S - 5 > hx && px + 5 < hx + hw && y + S - 5 > hy && y + 5 < hy + hh) { die(); return; }
      } else if (px + S - 3 > o.x && px + 3 < o.x + o.w && y + S > o.y && y < o.y + o.h) {
        if (dir === 1 && prevY + S <= o.y + 2) { y = o.y - S; vy = 0; }
        else if (dir === -1 && prevY >= o.y + o.h - 2) { y = o.y + o.h; vy = 0; }
        else { die(); return; }
      }
    }

    rot += (rotT - rot) * Math.min(1, dt * 16);
    trail.push({ x: px, y, a: 1 });
    for (const t of trail) t.a -= dt * 3;
    trail = trail.filter(t => t.a > 0);
    obs = obs.filter(o => o.x + o.w > camX - 100);
    fill();
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const h = (250 + camX / 45) % 360;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${h} 55% 11%)`); g.addColorStop(1, `hsl(${(h + 50) % 360} 55% 18%)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    const oy = (H - LH * sc) / 2;
    const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
    ctx.setTransform(DPR * sc, 0, 0, DPR * sc, sx * DPR, (oy + sy) * DPR);

    for (const L of [[0.15, 'rgba(255,255,255,.05)', 1.3], [0.35, 'rgba(0,0,0,.25)', 0.8]]) {
      ctx.fillStyle = L[1];
      for (const b of bld) {
        const bx = (((b.x - camX * L[0]) % 2400) + 2400) % 2400 - 200;
        if (bx > VW + 100) continue;
        ctx.fillRect(bx, FLOOR - b.h * L[2], b.w, b.h * L[2]);
      }
    }
    ctx.strokeStyle = 'rgba(255,255,255,.035)'; ctx.lineWidth = 1;
    for (let gx = -(camX % 80); gx < VW + 80; gx += 80) {
      ctx.beginPath(); ctx.moveTo(gx, CEIL); ctx.lineTo(gx, FLOOR); ctx.stroke();
    }

    const accent = `hsl(${h} 90% 62%)`, hazard = `hsl(${(h + 170) % 360} 90% 62%)`;
    ctx.fillStyle = `hsl(${h} 45% 7%)`;
    ctx.fillRect(-20, -400, VW + 40, CEIL + 400);
    ctx.fillRect(-20, FLOOR, VW + 40, LH - FLOOR + 400);
    ctx.strokeStyle = accent; ctx.lineWidth = 3; ctx.shadowColor = accent; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.moveTo(-20, CEIL); ctx.lineTo(VW + 20, CEIL);
    ctx.moveTo(-20, FLOOR); ctx.lineTo(VW + 20, FLOOR); ctx.stroke();
    ctx.shadowBlur = 0;

    if (obs) for (const o of obs) {
      const x = o.x - camX;
      if (x > VW + 50 || x + o.w < -50) continue;
      if (o.t === 's') {
        ctx.fillStyle = hazard; ctx.beginPath();
        if (o.sd === 'f') { ctx.moveTo(x, FLOOR); ctx.lineTo(x + o.w / 2, FLOOR - o.h); ctx.lineTo(x + o.w, FLOOR); }
        else { ctx.moveTo(x, CEIL); ctx.lineTo(x + o.w / 2, CEIL + o.h); ctx.lineTo(x + o.w, CEIL); }
        ctx.closePath(); ctx.fill();
      } else {
        ctx.fillStyle = `hsl(${(h + 170) % 360} 50% 20%)`; ctx.fillRect(x, o.y, o.w, o.h);
        ctx.strokeStyle = hazard; ctx.lineWidth = 3; ctx.strokeRect(x + 1.5, o.y + 1.5, o.w - 3, o.h - 3);
      }
    }

    if (trail) for (const t of trail) {
      ctx.globalAlpha = Math.max(0, t.a) * 0.35; ctx.fillStyle = accent;
      ctx.fillRect(t.x - camX, t.y, S, S);
    }
    ctx.globalAlpha = 1;

    if (state !== 'dead') {
      ctx.save();
      ctx.translate(PX + S / 2, y + S / 2); ctx.rotate(rot);
      ctx.fillStyle = '#fff'; ctx.fillRect(-S / 2, -S / 2, S, S);
      ctx.fillStyle = accent; ctx.fillRect(-S / 2 + 5, -S / 2 + 5, S - 10, S - 10);
      ctx.fillStyle = '#10143a'; ctx.fillRect(1, -8, 5, 5); ctx.fillRect(1, 3, 5, 5);
      ctx.restore();
    }
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.a); ctx.fillStyle = '#fff';
      ctx.fillRect(p.x - camX, p.y, 6, 6);
    }
    ctx.globalAlpha = 1;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.font = '700 28px "Trebuchet MS",system-ui,sans-serif';
    ctx.fillText(state === 'menu' ? '' : score() + ' m', W / 2, 44);
    ctx.font = '600 14px "Trebuchet MS",system-ui,sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillText('Best ' + best + ' m', W / 2, 66);
    if (state === 'play' && camX < 700) {
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '700 18px "Trebuchet MS",system-ui,sans-serif';
      ctx.fillText('Tap or press Space to flip gravity', W / 2, H / 2);
    }
  }

  function loop(t) {
    const dt = Math.min((t - last) / 1000, 0.03); last = t;
    update(dt); draw();
    requestAnimationFrame(loop);
  }

  // input
  addEventListener('keydown', e => {
    const k = e.code;
    if (state === 'play') {
      if ((k === 'Space' || k === 'ArrowUp' || k === 'ArrowDown' || k === 'KeyW' || k === 'KeyS') && !e.repeat) {
        e.preventDefault(); flip();
      }
    } else if (k === 'Enter' || k === 'Space') {
      e.preventDefault(); start();
    }
  });
  cv.addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'play') flip(); });
  $('play').addEventListener('click', start);

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
